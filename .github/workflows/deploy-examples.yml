name: Deploy examples to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - ".github/workflows/deploy-examples.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all examples
        run: pnpm run build:examples

      - name: Prepare docs folder for GitHub Pages
        run: |
          rm -rf docs
          mkdir -p docs

          # 定义映射关系：源目录 -> 目标子目录（相对于 docs）
          declare -A mappings=(
            ["examples/vue-force-graph/dist"]=""
            ["examples/vue-force-graph-2d/dist"]="2d"
            ["examples/vue-force-graph-3d/dist"]="3d"
            ["examples/vue-force-graph-ar/dist"]="ar"
            ["examples/vue-force-graph-vr/dist"]="vr"
          )

          for src in "${!mappings[@]}"; do
            if [ -d "$src" ]; then
              target_dir="docs/${mappings[$src]}"
              mkdir -p "$target_dir"
              cp -r "$src"/* "$target_dir/"
              echo "✅ Copied $src -> $target_dir"
            else
              echo "⚠️  Source directory $src not found, skipping."
            fi
          done

          touch docs/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
